name: Refresh vendored playwright

# Bumps lib/playwright + lib/playwright-cli to their forks' main and rebuilds vendor-src/, opening a
# PR — only when a fork moved (or vendor-src/ drifted from the pins); otherwise exits in seconds.
# Runs after upstream-sync.yml (Mondays) so merged upstream updates land here by midweek.
on:
  schedule:
    - cron: '17 3 * * 3' # Wednesday 12:17 JST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-vendor
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'snomiao/rechrome'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Refresh if a fork changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/refresh-vendor.sh
